# Example deployment behind Traefik.
#   1. cp .env.example .env  (set MASTER_KEY, PUBLIC_HOST and IMAGE_TAG)
#   2. docker compose up -d
#   3. docker compose exec postbus node dist/cli/add-user.js "Name"
# Without Traefik: drop the labels and uncomment `ports`.
#
# CI publishes ghcr.io/<owner>/<repo>:sha-<short> on every push to main. Pin
# IMAGE_TAG to one of those: it names exactly one build, so a rollback is a
# tag change rather than a rebuild, and the server never compiles
# better-sqlite3 from source. `build: .` is here for local work only.

services:
  postbus:
    image: ${POSTBUS_IMAGE:-ghcr.io/hallosouf/postbus-mcp}:${IMAGE_TAG:?pin a sha-xxxxxxx tag published by CI}
    build: .
    container_name: postbus-mcp
    restart: unless-stopped

    environment:
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env (openssl rand -hex 32)}
      DATABASE_PATH: /data/postbus.db
      PORT: "3000"
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
      MAIL_TIMEOUT_MS: "30000"
      MAX_MESSAGE_BYTES: "2097152"
      RATE_LIMIT_PER_MINUTE: "60"

      # Optional: Gmail API provider (OAuth).
      # GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

    volumes:
      # SQLite database with the encrypted app passwords.
      - postbus-data:/data

    # Without a reverse proxy, publish the port yourself.
    # ports:
    #   - "3000:3000"

    networks:
      - proxy

    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.postbus.rule: Host(`${PUBLIC_HOST:-mcp.example.com}`)
      traefik.http.routers.postbus.entrypoints: websecure
      traefik.http.routers.postbus.tls: "true"
      traefik.http.routers.postbus.tls.certresolver: letsencrypt
      traefik.http.services.postbus.loadbalancer.server.port: "3000"
      # Without this Traefik keeps routing to a container Docker has already
      # marked unhealthy.
      traefik.http.services.postbus.loadbalancer.healthcheck.path: /health
      traefik.http.services.postbus.loadbalancer.healthcheck.interval: 30s

volumes:
  postbus-data:

networks:
  proxy:
    external: true
