name: Code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push on the same ref makes the running one pointless.
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, types and advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck (src + tests)
        run: npm run typecheck

      # Only what ships in the container counts; a devDependency advisory
      # should not turn the build red.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Tests on Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor from package.json, 22 is what the container runs.
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check the build
        run: npm run build
