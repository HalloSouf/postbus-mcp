name: Code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push on the same ref makes the running one pointless.
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, types, tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Latest LTS, matching the Dockerfile.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck (src + tests)
        run: npm run typecheck

      # Only what ships in the container counts; a devDependency advisory
      # should not turn the build red.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Check the build
        run: npm run build
