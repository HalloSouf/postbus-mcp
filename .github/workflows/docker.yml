name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to commit SHAs, not tags: a tag can be moved, and the
# publish job holds a registry token.

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build the image and try it
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Only the push on main ends up needing this.
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Loaded into the local daemon so the steps below can actually run it.
      # better-sqlite3 compiles from source, so the cache earns its keep.
      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: postbus-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The unit tests never touch the container, so check the whole thing
      # actually boots: native module built, database created, HTTP reachable.
      - name: Start the container
        run: |
          docker run -d --name postbus-ci \
            -e MASTER_KEY="$(openssl rand -hex 32)" \
            -p 3000:3000 \
            postbus-mcp:ci

      - name: Wait for the healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server never came up:"
          docker logs postbus-ci
          exit 1

      - name: Run an admin script inside the container
        run: docker exec postbus-ci node dist/cli/add-user.js "CI" | grep -q "pb_"

      - name: MCP endpoint requires a token
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')

          if [ "$status" != "401" ]; then
            echo "expected 401 without a token, got $status"
            exit 1
          fi

      - name: Server refuses to start without MASTER_KEY
        run: |
          if docker run --rm postbus-mcp:ci 2>&1 | grep -q "MASTER_KEY is missing"; then
            echo "refused to start, as expected"
          else
            echo "server should have refused to start without MASTER_KEY"
            exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: docker logs postbus-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f postbus-ci || true

      # Only after the image has been shown to boot, serve /health, run a CLI
      # script and refuse an untokened request.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # sha-<short> is the one to deploy: it names exactly one build and
          # never moves, which "latest" cannot promise.
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
